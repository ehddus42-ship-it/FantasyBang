<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello Score</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f5f5f5;
    gap: 24px;
  }
  #score {
    font-size: 3rem;
    font-weight: bold;
  }
  button {
    font-size: 1.5rem;
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    background: #4f46e5;
    color: white;
    cursor: pointer;
  }
  button:active {
    background: #4338ca;
  }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <button id="hello-btn">Hello</button>
  <script>
    let score = 0;
    const scoreEl = document.getElementById('score');
    document.getElementById('hello-btn').addEventListener('click', () => {
      score += 1;
      scoreEl.textContent = `Score: ${score}`;
    });
  </script>
</body>
</html>
