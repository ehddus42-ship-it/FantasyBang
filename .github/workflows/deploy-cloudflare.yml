name: Deploy to Cloudflare Workers

# 이 브랜치에 push하면 자동으로 build:static + wrangler deploy가 돌아간다.
# (로컬 wrangler dev 검증 + 첫 실배포까지 확인을 마쳤으므로 자동 배포로 전환함.)
# 필요하면 Actions 탭에서 workflow_dispatch로 수동 재실행도 가능하다.
on:
  push:
    branches: ["claude/repo-permissions-check-vqw0v1"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run rule/test suite
        run: npm test

      - name: Build static assets
        run: npm run build:static

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
